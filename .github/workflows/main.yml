name: Update formula

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: macos-latest
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
      - uses: Homebrew/actions/setup-git-user@main

      - name: Fetch latest release from PyPI
        run: |
          set -euo pipefail
          json=$(curl -fsSL --retry 5 --retry-all-errors https://pypi.org/pypi/bonbast/json)
          sdist=$(jq -c '.urls[] | select(.packagetype == "sdist")' <<<"$json")
          {
            echo "VERSION=$(jq -r .info.version <<<"$json")"
            echo "URL=$(jq -r .url <<<"$sdist")"
            echo "SHA256=$(jq -r .digests.sha256 <<<"$sdist")"
          } >> "$GITHUB_ENV"

      - name: Generate formula
        run: |
          cat > "$(brew --repo samadipour/bonbast)/Formula/bonbast.rb" <<EOF
          class Bonbast < Formula
            include Language::Python::Virtualenv

            desc "Gold prices and Iranian Rial exchange rates from bonbast.com"
            homepage "https://github.com/SamadiPour/bonbast"
            url "$URL"
            sha256 "$SHA256"
            license "MIT"

            depends_on "python@3.14"

            def install
              virtualenv_install_with_resources
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/bonbast --version")
            end
          end
          EOF
          brew update-python-resources samadipour/bonbast/bonbast

      - name: Audit, install, test
        run: |
          brew audit --strict samadipour/bonbast/bonbast
          brew install --build-from-source --verbose samadipour/bonbast/bonbast
          brew test --verbose samadipour/bonbast/bonbast

      - name: Commit
        id: commit
        run: |
          cd "$(brew --repo samadipour/bonbast)"
          if git diff --quiet; then echo "Formula unchanged"; exit 0; fi
          git commit -am "build: update formula to $VERSION"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Push
        if: steps.commit.outputs.committed == 'true'
        uses: Homebrew/actions/git-try-push@main
        with:
          token: ${{ github.token }}
          branch: main
